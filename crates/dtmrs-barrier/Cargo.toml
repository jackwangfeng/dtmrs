[package]
name = "dtmrs-barrier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Sub-transaction barrier: one table solving idempotence, empty rollback and suspension"

readme = "README.md"

[features]
default = []
# 业务数据在 Redis 里（秒杀库存那类）时用。原子性来自 Lua 脚本而不是 SQL 事务
redis = ["dep:redis"]

[dependencies]
dtmrs-core = { path = "../dtmrs-core", version = "0.6.0" }
redis = { workspace = true, optional = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
