[package]
name = "dtmrs-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "C ABI for dtmrs - embed the transaction coordinator into any language"
readme = "README.md"

# 头文件一起发出去，C/C++ 用户不用回仓库找
include = ["src/**/*", "README.md", "dtmrs.h"]

[lib]
name = "dtmrs"
crate-type = ["cdylib", "staticlib", "rlib"]


[dependencies]
dtmrs-core = { path = "../dtmrs-core", version = "0.1.0" }
# 关掉 grpc：这里要的是尽量小的 .so，而嵌入式宿主基本用 local:// 分支。
# 带上 tonic 整条依赖树会让 .so 明显变大，还要求构建机装 protoc
dtmrs-server = { path = "../dtmrs-server", version = "0.1.0", default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true }
