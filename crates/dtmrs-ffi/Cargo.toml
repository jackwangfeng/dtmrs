[package]
name = "dtmrs-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "C ABI for dtmrs - embed the transaction coordinator into any language"
readme = "README.md"

# 头文件一起发出去，C/C++ 用户不用回仓库找
include = ["src/**/*", "README.md", "dtmrs.h"]

[lib]
name = "dtmrs"
# 刻意不带 rlib：rlib 只对 Rust→Rust 链接有用，而这个 crate 是给 C 用的。
# 留着它会跟 facade crate `dtmrs` 的 rlib 撞同一个输出文件名
# （cargo 现在只警告，但明说未来可能变成硬错误）
crate-type = ["cdylib", "staticlib"]


[features]
# Redis 默认开：绑定的用户只会 `cargo build -p dtmrs-ffi --release`，关着的话
# 传 redis:// 只会收到一句「没开 dtmrs-store 的 redis feature」，想不到是这里。
# 代价实测 .so 11.7 MB → 12.8 MB（+9.5%），不需要额外的构建工具 ——
# 这跟 grpc 不一样（又大又要 protoc），所以 grpc 关、redis 开。
# 嫌大就 --no-default-features。
default = ["redis"]
# Redis 存储后端。语义跟 SQL 有差异，见 dtmrs-store::redis_store
redis = ["dtmrs-server/redis"]

[dependencies]
dtmrs-core = { path = "../dtmrs-core", version = "0.11.0" }
# 关掉 grpc：这里要的是尽量小的 .so，而嵌入式宿主基本用 local:// 分支。
# 带上 tonic 整条依赖树会让 .so 明显变大，还要求构建机装 protoc
dtmrs-server = { path = "../dtmrs-server", version = "0.11.0", default-features = false }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# 只有 Redis 那条测试用：开头结尾清自己的 key 前缀
dtmrs-store = { path = "../dtmrs-store", version = "0.11.0" }
