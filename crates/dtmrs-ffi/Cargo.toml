[package]
name = "dtmrs-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dtmrs 的 C ABI —— 让任何语言把事务协调器嵌进自己进程"

[lib]
name = "dtmrs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dtmrs-core = { path = "../dtmrs-core" }
dtmrs-server = { path = "../dtmrs-server" }
serde_json = { workspace = true }
tokio = { workspace = true }
