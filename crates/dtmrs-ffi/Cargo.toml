[package]
name = "dtmrs-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dtmrs 的 C ABI —— 让任何语言把事务协调器嵌进自己进程"

[lib]
name = "dtmrs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dtmrs-core = { path = "../dtmrs-core" }
# 关掉 grpc：这里要的是尽量小的 .so，而嵌入式宿主基本用 local:// 分支。
# 带上 tonic 整条依赖树会让 .so 明显变大，还要求构建机装 protoc
dtmrs-server = { path = "../dtmrs-server", default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true }
