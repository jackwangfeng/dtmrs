[package]
name = "dtmrs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Distributed transaction coordinator: SAGA / TCC / two-phase messaging / XA / workflow, over HTTP and gRPC, embeddable as a library"
readme = "README.md"


[features]
# gRPC 默认开。关掉能省下 tonic/prost 整条依赖树 —— dtmrs-ffi 就是这么做的，
# 那边要的是尽量小的 .so，而嵌入式宿主基本用 local:// 分支。
default = ["grpc"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost"]
# Redis 存储后端。语义跟 SQL 有差异，见 dtmrs-store::redis_store
redis = ["dtmrs-store/redis"]

[dependencies]
dtmrs-core = { path = "../dtmrs-core", version = "0.4.0" }
dtmrs-store = { path = "../dtmrs-store", version = "0.4.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
# 系统里没有 protoc 时兜底，见 build.rs
protoc-bin-vendored = { workspace = true }

[lib]
name = "dtmrs_server"
path = "src/lib.rs"

[dev-dependencies]
tokio = { workspace = true }
axum = { workspace = true }
dtmrs-xa = { path = "../dtmrs-xa", version = "0.4.0" }
sqlx = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio-stream = { workspace = true }
redis = { workspace = true }

[package.metadata.docs.rs]
# 默认就带 grpc；protoc 由 build.rs 兜底，docs.rs 上不需要额外装
all-features = true
