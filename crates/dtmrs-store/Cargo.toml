[package]
name = "dtmrs-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Storage layer for dtmrs: one set of SQL across sqlite / postgres / mysql via sqlx::Any"

readme = "README.md"

[features]
# Redis 后端。默认关 —— 它跟 SQL 后端有实打实的语义差异（持久性、终态会过期），
# 不该让不需要的人默认背上这条依赖，也不该让人无意中用上
default = []
redis = ["dep:redis", "dep:serde_json"]

[dependencies]
dtmrs-core = { path = "../dtmrs-core", version = "0.2.0" }
redis = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
