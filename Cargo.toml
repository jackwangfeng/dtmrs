[workspace]
resolver = "2"
members = [
    "crates/dtmrs",
    "crates/dtmrs-core",
    "crates/dtmrs-store",
    "crates/dtmrs-server",
    "crates/dtmrs-barrier",
    "crates/dtmrs-ffi",
    "crates/dtmrs-xa",
    # 压测工具，不发布
    "bench/harness",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jackwangfeng/dtmrs"
homepage = "https://github.com/jackwangfeng/dtmrs"
authors = ["jackwangfeng"]
# 1.82：workspace 继承 + let-else + 2021 edition 都稳了。
# 不写死太高的版本，发布出去的库要照顾还没跟上的用户
rust-version = "1.82"
keywords = ["distributed", "transaction", "saga", "tcc", "microservices"]
categories = ["database", "asynchronous", "network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "any", "sqlite", "postgres", "mysql", "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-prost = "0.14"
redis = { version = "1", default-features = false, features = ["tokio-comp", "script"] }
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
