[workspace]
resolver = "2"
members = [
    "crates/dtmrs-core",
    "crates/dtmrs-store",
    "crates/dtmrs-server",
    "crates/dtmrs-barrier",
    "crates/dtmrs-ffi",
    "crates/dtmrs-xa",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jeffwang/dtmrs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "any", "sqlite", "postgres", "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
