[workspace]
resolver = "2"
members = [
    "crates/dtmrs",
    "crates/dtmrs-core",
    "crates/dtmrs-store",
    "crates/dtmrs-server",
    "crates/dtmrs-barrier",
    "crates/dtmrs-ffi",
    "crates/dtmrs-xa",
    # 压测工具，不发布
    "bench/harness",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jackwangfeng/dtmrs"
homepage = "https://github.com/jackwangfeng/dtmrs"
authors = ["jackwangfeng"]
# 1.82：workspace 继承 + let-else + 2021 edition 都稳了。
# 不写死太高的版本，发布出去的库要照顾还没跟上的用户
rust-version = "1.82"
keywords = ["distributed", "transaction", "saga", "tcc", "microservices"]
categories = ["database", "asynchronous", "network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "any", "sqlite", "postgres", "mysql", "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# TLS：tls-ring 跟 reqwest 的 rustls-tls 用同一个后端（rustls + ring），
# 不会在依赖树里拉进第二套 TLS 实现。
# 两套根证书都开，用 with_enabled_roots() 一起生效：
#   native-roots —— 内网自签 CA 通常装在系统信任库里，只有它管用
#   webpki-roots —— 内置 Mozilla 根，scratch 容器里没装 ca-certificates 时兜底
# 另有 DTMRS_GRPC_CA 可以再塞一个 PEM，覆盖「证书谁都不认」的情况
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots", "tls-webpki-roots"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic-prost = "0.14"
redis = { version = "1", default-features = false, features = ["tokio-comp", "script"] }
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
