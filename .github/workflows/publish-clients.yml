# 发布业务侧客户端到 npm / PyPI —— 全程 OIDC，仓库里不存任何长期 token。
#
# ⚠ 这个文件的**文件名**要填进 npmjs.com 和 PyPI 的信任配置里，改名会导致发布失败。
#
# 手动触发（workflow_dispatch）而不是推 tag 就发 —— 发布不可逆，
# npm/PyPI 只能 yank 不能删，让人显式点一下更安全。
name: publish-clients

on:
  workflow_dispatch:
    inputs:
      target:
        description: 发哪个
        required: true
        default: all
        type: choice
        options: [npm, pypi, maven, all]
      dry_run:
        description: 只演练不真发
        required: false
        default: true
        type: boolean

jobs:
  npm:
    if: inputs.target == 'npm' || inputs.target == 'all'
    runs-on: ubuntu-latest
    permissions:
      # OIDC 就靠它 —— 没有这条，npm 拿不到身份令牌
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 自带 npm 11.x，满足 trusted publishing 的 ≥11.5.1
          node-version: '24'
          # registry-url **必须有** —— npm 靠它知道该跟哪个 registry 做 OIDC 交换。
          # 去掉它会直接 ENEEDAUTH（撞过）。
          # setup-node 会写一个带 NODE_AUTH_TOKEN 占位符的 .npmrc，那是无害的：
          # npm 会先尝试 OIDC，失败才回退到 token
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 确认版本满足 trusted publishing 的要求
        run: |
          # 只在自带的不够新时才升级，且钉大版本 —— npm@latest 会随新版本
          # 抬高 Node 要求把自己搞挂（撞过：npm@12 要 Node ≥22.22）
          need=11.5.1
          cur=$(npm --version)
          if [ "$(printf '%s\n%s' "$need" "$cur" | sort -V | head -1)" != "$need" ]; then
            echo "npm $cur < $need，升级到 npm@11"
            npm install -g npm@11
          fi
          echo "npm=$(npm --version) node=$(node --version)"

      - name: 确认 OIDC 环境就绪
        run: |
          # 缺这两个变量说明 id-token: write 没生效，publish 会直接 ENEEDAUTH
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?缺 OIDC 环境变量，检查 permissions.id-token}"
          echo "OIDC 环境就绪，仓库 $GITHUB_REPOSITORY"

      - name: 看看会发什么
        working-directory: clients/node
        run: npm pack --dry-run

      - name: 演练
        if: inputs.dry_run
        working-directory: clients/node
        run: |
          echo "dry_run=true，只演练不发布"
          npm publish --dry-run

      - name: 发布（OIDC，无 token）
        if: ${{ !inputs.dry_run }}
        working-directory: clients/node
        # 配了 trusted publisher 之后 npm 自动走 OIDC，并附带 provenance
        run: npm publish

  pypi:
    if: inputs.target == 'pypi' || inputs.target == 'all'
    runs-on: ubuntu-latest
    # PyPI 的信任发布可以绑定到环境，加一层人工审批（可选）
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 构建
        working-directory: clients/python
        run: |
          python -m pip install --quiet build twine
          python -m build --outdir dist
          python -m twine check dist/*
          ls -la dist/

      - name: 演练
        if: inputs.dry_run
        run: echo "dry_run=true，构建和校验都过了，没有上传"

      - name: 发布（OIDC，无 token）
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist

  # Maven Central 没有 OIDC，只能用 GPG 私钥 + user token。
  #
  # 挪进 CI 的理由：本地签名要 pinentry，而 pinentry 要真终端 ——
  # 在没有 TTY 的环境里（CI、远程 shell、各种 agent）必然
  # `Inappropriate ioctl for device`，每次发版都要人去某个终端里解锁一次。
  # CI 里走 loopback pinentry + 环境变量密码，彻底绕开这个问题。
  #
  # ⚠ 仍然保留 pom 里的 autoPublish=false：构件只上传到门户并校验，
  # **最后一下要人去点**。Maven Central 发布后永远删不掉。
  maven:
    if: inputs.target == 'maven' || inputs.target == 'all'
    runs-on: ubuntu-latest
    # 建议在仓库设置里给这个 environment 配上人工审批
    environment: maven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # setup-java 会生成 ~/.m2/settings.xml，server id 必须是 central ——
          # pom 里的 publishingServerId 写死了这个名字
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          # 私钥交给 setup-java 导入，它会顺带配好 loopback pinentry
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: 确认 secrets 齐全
        env:
          U: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          P: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          K: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          # 早失败好过传一半再报错
          : "${U:?缺 MAVEN_CENTRAL_USERNAME}"
          : "${P:?缺 MAVEN_CENTRAL_PASSWORD}"
          : "${K:?缺 MAVEN_GPG_PRIVATE_KEY}"
          echo "secrets 齐了"

      # 把「Bad passphrase」从 maven 构建深处提到最前面，并且直接指出最常见的原因。
      # 不这么做的话，要跑完一轮 20 秒的构建才在 gpg 插件里报错，而那条错误
      # 不会告诉你「你的 secret 尾部多了个换行」
      - name: 自检 GPG 密码
        env:
          PASS: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # ⚠ 先确认私钥真的导进来了。少了这步的话，「密钥没导入」会伪装成
          # 「密码不对」—— 因为 gpg 找不到密钥时的报错也被 sign() 吞掉了
          echo "--- CI 里的私钥（指纹是公开信息，可以打印）---"
          gpg --list-secret-keys --keyid-format=long || true
          if ! gpg --list-secret-keys --with-colons | grep -q '^sec'; then
            echo "❌ CI 里一把私钥都没有 —— MAVEN_GPG_PRIVATE_KEY 的内容有问题。"
            echo "   要的是 gpg --export-secret-keys --armor <KEYID> 的**完整输出**，"
            echo "   含 -----BEGIN PGP PRIVATE KEY BLOCK----- 和 END 两行。"
            exit 1
          fi
          sign() { echo t | gpg --batch --yes --pinentry-mode loopback \
                     --passphrase "$1" --clearsign >/dev/null 2>&1; }
          if sign "$PASS"; then
            echo "✓ GPG 密码可用"
            exit 0
          fi
          # 去掉首尾空白再试一次 —— 能过就说明 secret 里混进了换行/空格
          if sign "$(printf '%s' "$PASS" | tr -d '\r\n' | sed 's/[[:space:]]*$//')"; then
            echo "❌ 密码本身是对的，但 secret 里混进了换行或尾部空格。"
            echo "   多半是用 echo 管道设的（echo 会补 \\n）。重设一次："
            echo "     printf '%s' '你的密码' | gh secret set MAVEN_GPG_PASSPHRASE"
            exit 1
          fi
          echo "❌ MAVEN_GPG_PASSPHRASE 跟 MAVEN_GPG_PRIVATE_KEY 对不上。"
          echo "   注意这两个必须是同一把钥匙的 —— 换过密钥就要一起换。"
          exit 1

      - name: 演练（只构建和签名，不上传）
        if: inputs.dry_run
        working-directory: clients/java
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B -Prelease verify -DskipTests
          echo "--- 构件和签名 ---"
          ls -1 target/*.jar target/*.asc
          # 没有 .asc 就说明签名没生效，那样 deploy 到 Central 一定被拒。
          # ⚠ 别用 `test -f target/*.asc` —— glob 展开成多个文件时 test 只收
          # 一个参数，会直接返回假，把「签名齐全」误报成「没生成」（踩过）
          n=$(ls -1 target/*.asc 2>/dev/null | wc -l)
          echo "签名文件数: $n"
          # jar + sources + javadoc + pom = 4 个，少一个 Central 就会拒
          [ "$n" -ge 4 ] || { echo "❌ 签名不全，只有 $n 个（应有 4 个）"; exit 1; }

      - name: 上传到 Central（停在门户等人点发布）
        if: ${{ !inputs.dry_run }}
        working-directory: clients/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy -DskipTests

      - name: 提醒
        if: ${{ !inputs.dry_run }}
        run: |
          echo "构件已上传并校验。**最后一步要人工确认**："
          echo "https://central.sonatype.com/publishing/deployments"

