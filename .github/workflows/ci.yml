name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # sqlite-only：快，能挡住绝大多数回归
  test:
    name: 测试（sqlite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 刻意**不装** protoc：build.rs 在系统没有时会退回自带的那份，
      # 这条路径是发布到 crates.io 的关键（不能要求每个下游用户先装 protoc）。
      # 不装 = CI 每次都在验它还好使
      - name: 确认机器上确实没有 protoc（否则兜底路径没被测到）
        run: |
          if command -v protoc; then
            echo "::warning::runner 自带 protoc，本次没有验到 vendored 兜底"
          else
            echo "没有系统 protoc —— 走 vendored 兜底 ✓"
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # 真库测试。**这个 job 不能省** —— 存储 / 屏障 / XA 那几层的差异
  # 只有对着真 Postgres / MySQL / Redis 才验得出来，sqlite 全绿不代表它们没问题。
  # Redis 尤其如此：它连 SQL 都不是，原子性靠的是完全不同的机制（Lua 脚本）。
  test-real-db:
    name: 测试（真 Postgres + 真 MySQL + 真 Redis）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 不用 services: 因为 Postgres 的两阶段提交默认是关的
      # （max_prepared_transactions=0），必须自己带参数起，XA 才跑得了
      - name: 起 Postgres（打开两阶段提交）
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=dtmrs -e POSTGRES_DB=dtmrs \
            postgres:16-alpine -c max_prepared_transactions=32
      - name: 起 MySQL
        run: |
          docker run -d --name my -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=dtmrs -e MYSQL_DATABASE=dtmrs \
            mysql:8.0
      - name: 起 Redis
        run: docker run -d --name rd -p 6379:6379 redis:7-alpine
      - name: 等数据库就绪
        run: |
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 60); do
            docker exec my mysqladmin ping -uroot -pdtmrs >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec rd redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done

      - name: cargo test（配上全部四个真库开关）
        env:
          DTMRS_TEST_PG: postgres://postgres:dtmrs@127.0.0.1:5432/dtmrs
          DTMRS_TEST_MYSQL: mysql://root:dtmrs@127.0.0.1:3306/dtmrs
          DTMRS_TEST_XA_PG: postgres://postgres:dtmrs@127.0.0.1:5432/dtmrs
          DTMRS_TEST_XA_MYSQL: mysql://root:dtmrs@127.0.0.1:3306/dtmrs
          DTMRS_TEST_REDIS: redis://127.0.0.1:6379/0
        # 开 redis feature —— 它默认是关的，不开等于没测
        run: cargo test --workspace --features dtmrs/redis,dtmrs/barrier-redis,dtmrs-server/redis,dtmrs-store/redis,dtmrs-barrier/redis

  # 业务侧客户端（子事务屏障）：四个语言 × 两种数据库，同一套五场景断言。
  # 算法写错不会报错，是静默的重复扣款 —— 所以每个语言都得对着真库验。
  clients:
    name: 业务侧客户端（Java / Go / Python / Node）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 起 Postgres 和 MySQL
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=dtmrs -e POSTGRES_DB=dtmrs postgres:16-alpine
          docker run -d --name my -p 3306:3306 -e MYSQL_ROOT_PASSWORD=dtmrs -e MYSQL_DATABASE=dtmrs mysql:8.0
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 60); do docker exec my mysqladmin ping -uroot -pdtmrs >/dev/null 2>&1 && break; sleep 2; done

      - name: Java
        working-directory: clients/java
        env:
          DTMRS_TEST_PG: jdbc:postgresql://127.0.0.1:5432/dtmrs?user=postgres&password=dtmrs
          DTMRS_TEST_MYSQL: jdbc:mysql://127.0.0.1:3306/dtmrs?user=root&password=dtmrs
        run: |
          mkdir -p lib && cd lib
          curl -sSLO https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
          curl -sSLO https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.4.0/mysql-connector-j-8.4.0.jar
          cd .. && ./run-test.sh

      - name: Go
        working-directory: clients/go
        env:
          DTMRS_TEST_PG_GO: postgres://postgres:dtmrs@127.0.0.1:5432/dtmrs?sslmode=disable
          DTMRS_TEST_MYSQL_GO: root:dtmrs@tcp(127.0.0.1:3306)/dtmrs
        run: go test -v ./...

      - name: Python
        working-directory: clients/python
        env:
          DTMRS_TEST_PG_PY: postgresql://postgres:dtmrs@127.0.0.1:5432/dtmrs
          DTMRS_TEST_MYSQL_PY: 127.0.0.1|3306|root|dtmrs|dtmrs
        run: |
          pip install --quiet psycopg2-binary pymysql
          python3 test_barrier.py

      - name: Node
        working-directory: clients/node
        env:
          DTMRS_TEST_PG_NODE: postgresql://postgres:dtmrs@127.0.0.1:5432/dtmrs
          DTMRS_TEST_MYSQL_NODE: mysql://root:dtmrs@127.0.0.1:3306/dtmrs
        run: npm install --no-audit --no-fund && node test.js

      # 文档里的例子必须真能跑 —— 起真 TC + 真 MySQL，四个语言各走
      # 正常提交/逆序补偿/幂等三个场景，断言的是**账户余额**不是"没报错"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编 TC 二进制
        run: cargo build --release -p dtmrs
      - name: 验证各语言示例端到端
        env:
          MYSQL_PORT: '3306'
        run: |
          cd clients/node && npm install --no-audit --no-fund && cd ../..
          cd clients/python && pip install --quiet pymysql && cd ../..
          # 脚本里用 docker exec 查库，CI 里容器名是 my
          sed -i 's/docker exec dtmrs-my/docker exec my/' clients/verify-examples.sh
          clients/verify-examples.sh all

  # 四个语言绑定都得能实际跑起来，不是编过就算
  bindings:
    name: 语言绑定（C / Python / Node / JVM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编 .so
        run: cargo build -p dtmrs-ffi --release

      - name: C 示例
        run: |
          gcc -I include examples/c/demo.c -L target/release -ldtmrs -o /tmp/demo
          LD_LIBRARY_PATH=target/release /tmp/demo

      - name: Python 示例
        run: python3 bindings/python/example.py

      - name: Node 示例
        working-directory: bindings/node
        run: |
          npm install --no-audit --no-fund
          node example.js

      - name: JVM 示例
        working-directory: bindings/java
        run: ./run.sh
